[package]
name = "wallis-discord"
version = "0.1.0"
edition = "2021"

[dependencies]
wallis-core = { path = "../wallis-core" }
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "model", "rustls_backend", "cache", "builder", "http", "voice", "utils"] }
songbird = { version = "0.6.1", default-features = false, features = ["driver", "gateway", "rustls", "serenity", "receive", "tungstenite", "builtin-queue"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde_json = "1"
