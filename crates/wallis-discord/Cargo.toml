[package]
name = "wallis-discord"
version = "0.1.0"
edition = "2021"

[dependencies]
wallis-core = { path = "../wallis-core" }
twilight-gateway = { version = "0.17", default-features = false, features = ["rustls-webpki-roots", "twilight-http", "zlib"] }
twilight-http = { version = "0.17", default-features = false, features = ["rustls-webpki-roots", "decompression"] }
twilight-model = "0.17"
twilight-cache-inmemory = "0.17"
twilight-util = { version = "0.17", features = ["builder"] }
songbird = { version = "0.6.1", default-features = false, features = ["driver", "gateway", "rustls", "twilight", "receive", "tungstenite", "builtin-queue"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde_json = "1"
async-trait = "0.1"
