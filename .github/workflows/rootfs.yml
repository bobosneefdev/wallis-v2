name: Wallis rootfs

on:
  workflow_dispatch:
    inputs:
      version:
        description: Wallis rootfs version
        required: true
        default: 0.1.0
  push:
    tags:
      - rootfs-v*
  pull_request:
    paths:
      - scripts/rootfs/**
      - .github/workflows/rootfs.yml

permissions:
  contents: write

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check rootfs scripts
        run: bash -n scripts/rootfs/build.sh scripts/rootfs/check.sh

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Select rootfs version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/rootfs-v* ]]; then
            version="${GITHUB_REF_NAME#rootfs-v}"
          else
            version="$INPUT_VERSION"
          fi
          if [[ ! "$version" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "Invalid rootfs version: $version" >&2
            exit 1
          fi
          printf 'WALLIS_ROOTFS_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Build rootfs archive
        run: sudo bash scripts/rootfs/build.sh
      - name: Check rootfs archive
        run: bash scripts/rootfs/check.sh "dist/rootfs/wallis-rootfs-${WALLIS_ROOTFS_VERSION}.tar"
      - name: Upload rootfs artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wallis-rootfs-${{ env.WALLIS_ROOTFS_VERSION }}
          path: dist/rootfs/wallis-rootfs-${{ env.WALLIS_ROOTFS_VERSION }}.tar*
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/rootfs/wallis-rootfs-${WALLIS_ROOTFS_VERSION}.tar* --generate-notes
