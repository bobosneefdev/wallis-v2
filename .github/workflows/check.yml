name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check && bun run lint && bun run test && bun run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p wallis-core -p wallis-discord -p wallis-bot
      - run: cargo build --release -p wallis-bot
      # Disposable runner: Ubuntu's AppArmor user-namespace restriction blocks bubblewrap.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: sudo --preserve-env=HF_TOKEN scripts/rootfs/build.sh target/release/wallis-bot "$RUNNER_TEMP/runtime" 0.4.0
      - uses: actions/upload-artifact@v4
        with:
          name: linux-runtime
          path: ${{ runner.temp }}/runtime/wallis-rootfs.tar.gz.*
          compression-level: 0
          retention-days: 1

  wsl-runtime:
    needs: runtime
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: linux-runtime
          path: runtime
      - name: Reassemble the runtime image
        shell: bash
        run: |
          cat runtime/wallis-rootfs.tar.gz.[0-9]* > runtime/wallis-rootfs.tar.gz
          (cd runtime && sha256sum -c wallis-rootfs.tar.gz.sha256)
      - name: Import and exercise the WSL2 runtime
        shell: pwsh
        env:
          WALLIS_WSL_TEST: '1'
        run: |
          $imported = $false
          try {
            wsl --import Wallis "$env:RUNNER_TEMP\wallis-distro" "$pwd\runtime\wallis-rootfs.tar.gz" --version 2
            if ($LASTEXITCODE -ne 0) { throw 'WSL2 import failed' }
            $imported = $true
            wsl -d Wallis -u root -- /opt/wallis/bin/wallis-bot --self-check
            if ($LASTEXITCODE -ne 0) { throw 'WSL2 sandbox, browser or mod check failed' }
            $env:WALLIS_WSL_ARCHIVE = "$pwd\runtime\wallis-rootfs.tar.gz"
            cargo test -p wallis-core --lib upgrade_preserves_data_and_failed_import_rolls_back -- --ignored --nocapture
            if ($LASTEXITCODE -ne 0) { throw 'WSL2 upgrade or rollback failed' }
            cargo test -p wallis-core --test wsl_runtime -- --ignored --nocapture
            if ($LASTEXITCODE -ne 0) { throw 'Windows manager integration failed' }
          } finally {
            if ($imported) { wsl --unregister Wallis }
          }

  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p wallis-core -p wallis
      - run: bun run installer
