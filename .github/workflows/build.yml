name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi

  runtime:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p wallis-core -p wallis-discord -p wallis-bot
      - run: cargo build --release -p wallis-bot
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: sudo scripts/rootfs/build.sh target/release/wallis-bot "$RUNNER_TEMP/runtime" '${{ needs.version.outputs.version }}'
      - uses: actions/upload-artifact@v4
        with:
          name: linux-runtime
          path: |
            ${{ runner.temp }}/runtime/wallis-rootfs.tar.gz
            ${{ runner.temp }}/runtime/wallis-rootfs.tar.gz.sha256

  installer:
    needs: [version, runtime]
    if: needs.version.outputs.new == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bun run check

      - run: bun run lint

      - run: bun run test

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - run: cargo test -p wallis-core

      - run: bun run installer

      - uses: actions/download-artifact@v4
        with:
          name: linux-runtime
          path: runtime

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ needs.version.outputs.version }}" target/release/bundle/nsis/*-setup.exe runtime/* --title "Wallis ${{ needs.version.outputs.version }}" --generate-notes
