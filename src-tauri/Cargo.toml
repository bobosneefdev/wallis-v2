[package]
name = "wallis"
version = "0.3.2"
description = "Wallis desktop application"
authors = ["Wallis contributors"]
edition = "2021"

[lib]
name = "wallis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
wallis-core = { path = "../crates/wallis-core" }
wallis-discord = { path = "../crates/wallis-discord" }
tokio = { version = "1", features = ["rt-multi-thread"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }
