[package]
name = "wallis"
version = "0.1.0"
description = "Wallis desktop application"
authors = ["Wallis contributors"]
edition = "2021"

[lib]
name = "wallis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
